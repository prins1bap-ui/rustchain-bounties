name: Bounty verification bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  verify-claim:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/bounty_verification_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify claim and post result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTCHAIN_NODE_URL: ${{ secrets.RUSTCHAIN_NODE_URL }}
        run: python issue_comment_handler.py
